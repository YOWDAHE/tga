name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

concurrency:
  group: deploy-tga-admin
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy admin frontend to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            REPO_DIR="${DEPLOY_PATH}/tga"
            BRANCH="${{ github.event.workflow_run.head_branch }}"

            cd "${REPO_DIR}"
            git fetch origin
            git checkout "${BRANCH}"
            git reset --hard "origin/${BRANCH}"

            cd "${DEPLOY_PATH}"
            docker-compose build frontend
            docker-compose up -d frontend

            # nginx resolves container addresses once, so after a container is replaced it keeps
            # proxying to the old, gone address (until its 6-hourly reload). Wait for the new
            # container to accept connections, then reload nginx so it picks up the new address.
            ready=""
            for i in $(seq 1 90); do
              if docker-compose exec -T frontend node -e "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
                ready=1; break
              fi
              sleep 2
            done
            docker-compose exec -T nginx nginx -s reload
            [ -n "$ready" ] || { echo "frontend did not start listening on 3001"; docker-compose logs --tail=80 frontend; exit 1; }
